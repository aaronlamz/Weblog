ull,{\"hidden\":true,\"children\":[\"$\",\"$11\",null,{\"fallback\":null,\"children\":[\"$\",\"$L12\",null,{\"promise\":\"$@13\"}]}]}]\n9:null\n"])</script><script>self.__next_f.push([1,"14:I[11850,[\"8079\",\"static/chunks/8079-2b3f7eedf4f1d672.js\",\"2402\",\"static/chunks/2402-3527955e28de82cf.js\",\"5612\",\"static/chunks/5612-3c1ae2a8191546c0.js\",\"7454\",\"static/chunks/app/%5Blocale%5D/blog/page-434ca86484a2ec8b.js\"],\"BlogPostList\"]\n15:Tf8f,"])</script><script>self.__next_f.push([1,"\n\u003e 时间过得是真快，转眼间一年又过去了，感觉是时候总结一下这一个平平无奇的一年。\n\n---\n\n## 💻 工作生涯\n\n转眼间职业生涯已经 12 个年头。平平无奇，比上不足比下有余吧。\n\n- **今年在做的事**：还是按部就班做着 Web 开发相关的工作。但目前心态也比较open，不执着工作的内卷，有机会就去尝试一些新的东西。最好是Work Life Balance，不要把自己逼得太紧。\n- **技术成长**：开始用 Cursor、Claude code 等 AI 工具，体验了 Vibe Coding，从「写代码」更多变成「和 AI 一起设计产品」，效率明显提升。\n- **Vibe Coding**：AI的出现直接变革了编程范式，用过才知道vibe coding是有多么的强大。简单的工作基本可以打破知识的壁垒，真正实现降维打击。这是风险也是机会，只能保持进步，抓住机会（一生都在卷的中国人😂）。\n- **兼职、个人项目**：今年在业余时间尝试了兼职、个人项目，发现自己的时间管理能力还是不够，需要更加合理地安排时间，提高效率。\n---\n\n## 🏠 生活日常\n\n### 生活节奏\n\n- **作息与健康**：养🐱的原因，基本能够保持早睡早起，作息比较规律了。前提是不要被前天晚上的工作影响😅。\n\n### 兴趣爱好\n\n- **阅读**：今年可能还是看得技术书比较多，还是要放下工作看看其他的书，开阔一下视野。\n- **健身**：随意健身也很多年年了，没啥成绩，养生为主。明年看看计划控制饮食争取达到一个比较标准的状态吧。\n\n---\n\n## ✈️ 旅行足迹\n\n### 去过的地方\n今年出去的地方相对比以往还是多了个，每年一次的计划还是要按部执行，生活还是要体验的。\n1. **[阿勒泰自驾]** — 风景很不错，就是最后一天自驾被大雪困住，塞车到天亮，也是一次难忘的体验。\n2. **[曼谷]** — 第一次去曼谷，吃吃逛逛很不错，国际化氛围很好。\n3. **[西藏阿里地区自驾]** — 广东人第一次看到下的鹅毛大雪，每天风景都是措，很出片，虽然第一天高反吐了，但行程还是很值得。\n\n### 旅行感悟\n\n- 还是多出去逛逛，感受一下不同的文化和风景，开阔一下视野。\n\n---\n\n## ❤️ 感情生活\n\n- 这个可能没什么好说的，与人为善，会多关心家人吧，跟朋友之间学会更好的沟通和表达。\n- 多社交，多出去走走，认识更多的人，多尝试新的东西。\n---\n\n## 🎯 探索新事物\n\n### 运动\n\n- **滑雪** 🎿：人生第一次滑雪，双板入门简单，单板入门太费劲了。明年继续玩一玩。\n- **羽毛球** 🏸：今年第一次参与了公司的羽毛球运动，体验还是不错的，打了2场。\n\n---\n\n## 💰 投资理财\n\n- **表现**：总体不太行，有赚有亏，算下来整体是负的，但也快回本了。\n- **经验教训**：不懂就不要投资，大部分都是运气了，也赚不大大钱，把时间花在更有价值的事情上。\n- **认知思考**：更多关注美股ETF投资，日常提升自我理财能力。\n---\n\n## 🌟 35 岁的思考\n\n2025 年，我 35 岁了，感受上其实还是没什么变化，并没有到30岁的那种立flag的那种节点的焦虑，接受自己的普通才是人生的常态吧。但也是时候重新审视一下自己的人生，重新规划一下自己的未来。\n\n---\n\n## 结语\n\n回顾 2025 年，在工作上多了 AI 和博客这些新体验，在生活里开始慢下来、做减法；旅行、感情、运动探索都有新的经历，投资虽然不太行，但教训很实在。35 岁这一年，对人生有了更多审视，也更清楚什么对自己真正重要。虽然谈不上多精彩，但每一步都是成长。\n\n**愿我们都能在人生的路上，成为更好的自己。** 🚀\n\n---\n拖了很久才写完，也是时候开始新的征程了。\n*最后更新：2026-03-07*\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"div\",null,{\"className\":\"container mx-auto px-5 pb-10 pt-6 sm:px-8 sm:pb-12 sm:pt-7\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto max-w-6xl\",\"children\":[[\"$\",\"header\",null,{\"className\":\"border-b border-foreground/10 pb-8 pt-2 sm:pb-9 sm:pt-3\",\"children\":[\"$\",\"div\",null,{\"className\":\"grid items-end gap-10 lg:grid-cols-[1fr_auto]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"max-w-3xl\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 text-sm font-semibold text-muted-foreground\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":24,\"height\":24,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-book-marked h-4 w-4\",\"children\":[[\"$\",\"path\",\"sqw3rj\",{\"d\":\"M10 2v8l3-3 3 3V2\"}],[\"$\",\"path\",\"k3hazp\",{\"d\":\"M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20\"}],\"$undefined\"]}],[\"$\",\"h1\",null,{\"children\":\"思考\"}]]}]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-2 gap-8 sm:gap-12\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"dd\",null,{\"className\":\"text-3xl font-semibold tracking-[-0.04em] sm:text-4xl\",\"children\":2}],[\"$\",\"dt\",null,{\"className\":\"mt-1 text-xs text-muted-foreground\",\"children\":\"篇文章\"}]]}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"dd\",null,{\"className\":\"text-3xl font-semibold tracking-[-0.04em] sm:text-4xl\",\"children\":4}],[\"$\",\"dt\",null,{\"className\":\"mt-1 text-xs text-muted-foreground\",\"children\":\"个主题\"}]]}]]}]]}]}],[\"$\",\"section\",null,{\"aria-label\":
